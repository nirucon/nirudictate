[package]
name = "nirudictate"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
description = "Local speech-to-text dictation for the NIRUX desktop (whisper.cpp, X11)"
license = "MIT"
repository = "https://github.com/nirucon/nirudictate"

[dependencies]
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
x11rb = { version = "0.13", default-features = false, features = ["xtest", "xkb", "randr", "shape", "xfixes", "shm"] }
whisper-rs = "0.16"
ureq = "2.12"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1

# whisper.cpp is C/C++; even a debug build of it is unusably slow.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
